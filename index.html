<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safe Web Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d0d0d; color: #f4f4f4; font-family: Arial, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 14px; border-bottom: 1px solid #333; background: #111; }
    .bar { display: flex; gap: 8px; max-width: 1100px; margin: 0 auto; }
    input {
      flex: 1; padding: 12px 14px; border: 1px solid #444;
      background: #181818; color: #fff; font-size: 16px; outline: none;
    }
    button {
      padding: 12px 16px; border: 1px solid #555; background: #fff;
      color: #111; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #ddd; }
    main { flex: 1; display: flex; flex-direction: column; }
    .status {
      max-width: 1100px; width: 100%; margin: 0 auto;
      padding: 8px 14px; color: #aaa; font-size: 13px;
    }
    iframe {
      width: 100%; flex: 1; min-height: calc(100vh - 115px);
      border: 0; background: #fff;
    }
    .hint { color: #777; }
  </style>
</head>
<body>
  <header>
    <form id="navForm" class="bar">
      <input id="urlInput" autocomplete="off" placeholder="wikipedia.org" aria-label="Website address">
      <button type="submit">Open</button>
    </form>
  </header>

  <div class="status" id="status">
    Enter a site from the backend allowlist.
    <span class="hint">Example: wikipedia.org</span>
  </div>

  <main>
    <iframe id="viewer" title="Safe web viewer"></iframe>
  </main>

  <script src="config.js"></script>
  <script>
    const form = document.getElementById("navForm");
    const input = document.getElementById("urlInput");
    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");

    function normalizeUrl(value) {
      value = value.trim();
      if (!value) return "";
      if (!value.includes("://")) value = "https://" + value;
      return value;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const target = normalizeUrl(input.value);

      if (!target) {
        status.textContent = "Enter a website address.";
        return;
      }

      if (!window.BACKEND_URL || window.BACKEND_URL.includes("CHANGE-ME")) {
        status.textContent = "Set BACKEND_URL in config.js first.";
        return;
      }

      const backend = window.BACKEND_URL.replace(/\/+$/, "");
      viewer.src = backend + "/view?url=" + encodeURIComponent(target);
      status.textContent = "Opening " + target;
    });
  </script>
</body>
</html>
